; PHP upload limits for pedido attachments (RNF-07, RF-20).
;
; Inert by default: Laravel only loads config/*.php, and PHP reads this file
; only when the runtime variable PHP_INI_SCAN_DIR includes this directory
; (set in Railway through the README runbook; a leading ":" keeps the
; image's default scan dir).
;
; upload_max_filesize = 12M matches Livewire's default temporary-upload rule
; (max:12288 KB) and exceeds the 10 MB per-file limit of
; App\Services\PedidoAttachmentStorage::MAX_BYTES. post_max_size = 16M covers
; one file plus multipart overhead: Nova Solicitação uploads one file per
; request.

upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
